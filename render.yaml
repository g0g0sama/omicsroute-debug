services:
  - type: web
    name: omicsroute-debug-api
    branch: debug
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m scripts.precompute_coverage
    startCommand: python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OMICSROUTE_CORS_ORIGINS
        sync: false
