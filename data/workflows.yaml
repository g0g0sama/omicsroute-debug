      absence.

      '
    candidates:
    - virulencefinder
    - abricate
bacterial_illumina_mlst:
  name: Bacterial isolate — Illumina MLST and strain typing
  context:
    sample_type: Bacterial isolate
    sequencing: Illumina
    read_type: Paired-end
    goal: MLST / strain typing
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Evaluate Illumina read quality before bacterial strain typing.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Remove adapters and low-quality sequence when required.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: genome_assembly
    name: Genome assembly
    description: 'Produce a bacterial draft genome suitable for conventional assembly-based MLST.

      '
    candidates:
    - spades
    - shovill
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Evaluate the assembly before assigning allele profiles and sequence types.

      '
    candidates:
    - quast
  - operation: mlst_typing
    name: MLST / strain typing
    description: 'Determine bacterial allelic profiles and sequence types using established MLST schemes. Tool and scheme
      selection should match the organism and intended typing resolution.

      '
