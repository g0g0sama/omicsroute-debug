      '
    candidates:
    - dastool
  - operation: mag_quality
    name: MAG quality assessment
    description: 'Estimate genome completeness and contamination for the refined MAG collection.

      '
    candidates:
    - checkm2
  - operation: mag_taxonomy
    name: MAG taxonomic classification
    description: Assign standardized genome taxonomy to quality-controlled MAGs. GTDB-Tk is the preferred standardized
      bacterial/archaeal route. CAT/BAT and sourmash tax genome are curated methodological fallbacks when their own reference
      requirements are satisfied. A non-bacterial/non-archaeal input is a workflow-scope mismatch and should not be solved
      by simply switching tools.
    candidates:
    - gtdbtk
    - catbat
    - sourmash
  description: Coassemble two or more biologically compatible metagenomic samples, map every contributing sample back
    to the shared coassembly, preserve sample-specific coverage across multiple BAMs, run multiple independent binners
    and refine the resulting bin sets before quality assessment and taxonomy.
