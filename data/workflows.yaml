    - mlst
    - pymlst
bacterial_illumina_prophage:
  name: Bacterial isolate — Illumina prophage detection
  context:
    sample_type: Bacterial isolate
    sequencing: Illumina
    read_type: Paired-end
    goal: Prophage detection
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Evaluate sequencing quality before genome reconstruction and prophage analysis.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Remove adapters and low-quality sequence when indicated by quality-control results.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: genome_assembly
    name: Genome assembly
    description: 'Reconstruct the bacterial genome for detection of integrated viral regions.

      '
    candidates:
    - spades
    - shovill
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Assess assembly quality because fragmented assemblies can affect prophage boundary detection.

      '
    candidates:
    - quast
  - operation: genome_annotation
    name: Genome annotation
    description: 'Annotate the bacterial assembly. Annotation is particularly useful for predictors such as PhiSpy that
      use gene-level information, while other tools can operate directly on nucleotide assemblies.

      '
    candidates:
    - bakta
    - prokka
  - operation: prophage_detection
    name: Prophage detection
    description: 'Detect viral sequences integrated within the bacterial genome. Different algorithms use different genomic
      signals, so predicted regions should be interpreted as computational candidates.

      '
    candidates:
    - genomad
    - phispy
bacterial_illumina_variant_analysis:
  name: Bacterial isolate — Illumina variant analysis
  context:
    sample_type: Bacterial isolate
    sequencing: Illumina
    read_type: Paired-end
    goal: Variant analysis
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Evaluate raw Illumina sequencing quality before reference-based variant analysis.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Remove adapters and low-quality bases when indicated by raw-read quality assessment.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: read_mapping
    name: Reference genome alignment
    description: 'Align sequencing reads against an appropriate bacterial reference genome. Reference selection can substantially
      affect downstream variant calls.

      '
    candidates:
    - bwa_mem2
  - operation: alignment_processing
    name: Alignment sorting and indexing
    description: 'Convert the sequence alignment into a coordinate-sorted BAM file and create its index before variant
      calling.

      '
    candidates:
    - samtools
  - operation: variant_calling
    name: Variant calling
    description: 'Identify SNPs, indels and other supported sequence variants from mapped reads.

      '
    candidates:
    - bcftools
    - freebayes
  - operation: variant_filtering
    name: Variant filtering and normalization
    description: 'Filter and normalize variant calls before biological interpretation or comparative analysis. Appropriate
      depth, quality and allele-frequency thresholds depend on the experimental context.

      '
    candidates:
    - bcftools
  external_inputs:
  - reference_genome_fasta
bacterial_illumina_pangenome:
  name: Bacterial isolates — Illumina pangenome analysis
  context:
    sample_type: Bacterial isolate
    sequencing: Illumina
    read_type: Paired-end
    goal: Pangenome analysis
  external_inputs:
  - raw_paired_fastq_collection
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Evaluate sequencing quality for each isolate before comparative genome reconstruction.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Perform adapter removal and quality filtering when required.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: genome_assembly
    name: Genome assembly
    description: 'Assemble each bacterial isolate independently. Comparable assembly quality across isolates is important
      for robust pangenome analysis.

      '
    candidates:
    - spades
    - shovill
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Assess each assembly before inclusion in the comparative genome dataset.

      '
    candidates:
    - quast
  - operation: genome_annotation
    name: Standardized genome annotation
    description: 'Annotate all genomes using a consistent method and database version to reduce technical differences
      in downstream gene-family inference.

      '
    candidates:
    - bakta
    - prokka
  - operation: pangenome_analysis
    name: Pangenome analysis
    description: 'Cluster homologous genes across multiple bacterial isolates and characterize conserved and variable
      genomic content. This analysis requires multiple genomes rather than a single bacterial isolate.

      '
    candidates:
    - panaroo
    - ppanggolin
bacterial_illumina_phylogenomics:
  name: Bacterial isolates — Illumina phylogenomics
  context:
    sample_type: Bacterial isolate
    sequencing: Illumina
    read_type: Paired-end
    goal: Phylogenomics
  external_inputs:
  - raw_paired_fastq_collection
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Evaluate sequencing quality across all isolates before comparative genome analysis.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Remove adapters and low-quality sequence when required.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: genome_assembly
    name: Genome assembly
    description: 'Assemble each bacterial isolate independently before comparative phylogenomic analysis.

      '
    candidates:
    - spades
    - shovill
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Evaluate assembly quality and exclude severely incomplete or problematic genomes before constructing
      a comparative alignment.

      '
    candidates:
    - quast
  - operation: genome_annotation
    name: Standardized genome annotation
    description: 'Annotate all genomes consistently before core-genome identification.

      '
    candidates:
    - bakta
    - prokka
  - operation: core_genome_alignment
    name: Core genome alignment
    description: 'Identify shared orthologous genes across isolates and construct a core-genome alignment suitable for
      phylogenetic inference.

      '
    candidates:
    - panaroo
  - operation: phylogenetic_inference
    name: Phylogenetic inference
    description: 'Infer a maximum-likelihood phylogenetic tree from the core-genome alignment and estimate branch support.

      '
    candidates:
    - iqtree2
    - raxmlng
  description: Core-gene phylogenomics from multiple bacterial isolates using standardized assembly/annotation, Panaroo
    core-gene alignment and maximum-likelihood tree inference. This is a concatenated core-gene route; recombination-aware
    tools such as Gubbins require a whole-genome alignment and should not be inserted blindly after a Panaroo concatenated
    gene alignment.
bacterial_illumina_ont_hybrid:
  name: Bacterial isolate — Illumina + Oxford Nanopore hybrid assembly
  context:
    sample_type: Bacterial isolate
    sequencing:
    - Illumina
    - Oxford Nanopore
    read_type:
    - Paired-end
    - Long reads
    goal: Genome assembly
  steps:
  - operation: raw_read_qc
    name: Illumina read quality control
    description: 'Assess paired-end Illumina read quality before hybrid bacterial genome reconstruction.

      '
    context:
      sequencing: Illumina
      read_type: Paired-end
    candidates:
    - fastqc
  - operation: raw_read_qc
    name: Oxford Nanopore read quality control
    description: 'Assess Oxford Nanopore read length and quality distributions before hybrid genome assembly.

      '
    context:
      sequencing: Oxford Nanopore
      read_type: Long reads
    candidates:
    - nanoplot
  - operation: read_preprocessing
    name: Illumina read preprocessing
    description: 'Remove adapters and low-quality short-read sequence when indicated by quality control.

      '
    context:
      sequencing: Illumina
      read_type: Paired-end
    candidates:
    - fastp
    - cutadapt
  - operation: read_preprocessing
    name: Oxford Nanopore read preprocessing
    description: 'Perform optional quality and length filtering of long reads when appropriate.

      '
    context:
      sequencing: Oxford Nanopore
      read_type: Long reads
    candidates:
    - chopper
    - filtlong
  - operation: hybrid_genome_assembly
    name: Hybrid genome assembly
    description: 'Combine matched Illumina paired-end reads and Oxford Nanopore long reads from the same bacterial isolate
      to improve assembly continuity, repeat resolution and genome completion.

      '
    candidates:
    - hybracter
    - unicycler
    - spades
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Evaluate the hybrid genome assembly before downstream annotation and interpretation.

      '
    candidates:
    - quast
  - operation: genome_annotation
    name: Genome annotation
    description: 'Identify genes and other genomic features in the reconstructed bacterial genome.

      '
    candidates:
    - bakta
    - prokka
  description: Hybrid bacterial isolate assembly from matched Illumina and Oxford Nanopore data. Hybracter is the long-read-first
    route; Unicycler is short-read-first; SPAdes treats long reads as supplementary hybrid evidence. These strategies
    are not assumed to be biologically or computationally identical.
bacterial_illumina_pacbio_hybrid:
  name: Bacterial isolate — Illumina + PacBio hybrid assembly
  context:
    sample_type: Bacterial isolate
    sequencing:
    - Illumina
    - PacBio
    read_type:
    - Paired-end
    - Long reads
    goal: Genome assembly
  steps:
  - operation: raw_read_qc
    name: Illumina read quality control
    description: 'Assess paired-end Illumina read quality before hybrid bacterial genome reconstruction.

      '
    context:
      sequencing: Illumina
      read_type: Paired-end
    candidates:
    - fastqc
  - operation: raw_read_qc
    name: PacBio read quality control
    description: 'Assess PacBio long-read characteristics before hybrid genome assembly.

      '
    context:
      sequencing: PacBio
      read_type: Long reads
    candidates:
    - nanoplot
  - operation: read_preprocessing
    name: Illumina read preprocessing
    description: 'Remove adapters and low-quality short-read sequence when indicated by quality control.

      '
    context:
      sequencing: Illumina
      read_type: Paired-end
    candidates:
    - fastp
    - cutadapt
  - operation: read_preprocessing
    name: PacBio read preprocessing
    description: 'Perform optional long-read filtering when appropriate for the PacBio dataset.

      '
    context:
      sequencing: PacBio
      read_type: Long reads
    candidates:
    - filtlong
  - operation: hybrid_genome_assembly
    name: Hybrid genome assembly
    description: 'Combine matched Illumina paired-end reads and PacBio long reads from the same bacterial isolate for
      hybrid genome reconstruction.

      '
    candidates:
    - unicycler
    - spades
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Evaluate the hybrid genome assembly before downstream interpretation.

      '
    candidates:
    - quast
  - operation: genome_annotation
    name: Genome annotation
    description: 'Identify genes and other genomic features in the reconstructed bacterial genome.

      '
    candidates:
    - bakta
    - prokka
  description: Hybrid bacterial isolate assembly from matched Illumina and PacBio long reads. Unicycler provides a bacterial
    short-read-first hybrid route, while SPAdes can use PacBio long reads as supplementary hybrid evidence. PacBio subtype/accuracy
    should be considered before choosing the route.
metagenome_illumina_functional:
  name: Metagenome — Illumina functional profiling
  context:
    sample_type: Metagenome
    sequencing: Illumina
    read_type: Paired-end
    goal: Functional profiling
  steps:
  - operation: raw_read_qc
