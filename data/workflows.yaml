    - pathofact2
metagenome_illumina_viral:
  name: Metagenome — Illumina viral analysis
  context:
    sample_type: Metagenome
    sequencing: Illumina
    read_type: Paired-end
    goal: Viral analysis
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Assess metagenomic read quality before assembly and viral sequence detection.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Remove adapters and low-quality sequence when required.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: metagenome_assembly
    name: Metagenome assembly
    description: 'Assemble shotgun reads into contigs suitable for viral sequence identification.

      '
    candidates:
    - megahit
    - metaspades
  - operation: viral_sequence_detection
    name: Viral sequence detection
    description: 'Identify candidate viral contigs using complementary sequence classification methods. Different viral
      detectors may recover partially overlapping sets of sequences.

      '
    candidates:
    - genomad
    - virsorter2
  - operation: viral_quality
    name: Viral genome quality assessment
    description: Assess completeness/contamination and obtain CheckV-extracted virus/provirus sequences; a chosen quality
      threshold is a separate interpretation/filtering decision.
    candidates:
    - checkv
  - operation: viral_taxonomy
    name: Viral taxonomic classification
    description: Assign viral taxonomy with geNomad's marker/ICTV taxonomy framework.
    candidates:
    - genomad
  external_inputs: []
  description: Assembly-based viral analysis combining viral-sequence detection, CheckV quality/contamination assessment
    and viral taxonomy. geNomad taxonomy uses the geNomad marker database internally; BioFlow no longer treats an unspecified
    external viral-reference FASTA as a required input.
amplicon_illumina_16s:
  name: ASV · DADA2 modular (16S)
  description: 'Modular 16S ASV route: remove locus-specific primers when needed, infer exact sequence variants with
    DADA2, then classify representative ASVs. This route keeps the individual tools visible and replaceable.'
  context:
    sample_type: Amplicon
    sequencing: Illumina
    read_type: Paired-end
    goal: 16S rRNA analysis
    marker: 16S
    feature_strategy: asv
    route_family: modular_asv
    route_name: DADA2 modular 16S
  external_inputs:
  - amplicon_fastq
  - taxonomy_reference_database
  steps:
  - operation: primer_trimming
    name: Primer and adapter removal
    description: Remove locus-specific 16S PCR primers and residual adapter sequence before DADA2 inference when primers
      are still present.
    candidates:
    - cutadapt
  - operation: asv_inference
    name: ASV inference
    description: Infer exact amplicon sequence variants with DADA2, including error modelling, quality filtering, paired-read
      merging and chimera removal.
    candidates:
    - dada2
  - operation: taxonomy_assignment
    name: Taxonomic assignment
    description: Assign taxonomy to representative 16S ASVs using a classifier and reference database appropriate for
      the amplified 16S marker.
    candidates:
    - dada2_taxonomy
    - decipher_idtaxa
    - qiime2_feature_classifier
amplicon_illumina_16s_qiime2_asv:
  name: ASV · QIIME 2 q2-dada2 (16S)
  description: Integrated QIIME 2 16S ASV workflow using q2-cutadapt where primer removal is required, q2-dada2 for paired-end
    denoising/ASV inference, and q2-feature-classifier for taxonomy.
  context:
