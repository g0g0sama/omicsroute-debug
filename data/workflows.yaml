    name: MAG taxonomic classification
    description: Assign standardized genome taxonomy to quality-controlled MAGs. GTDB-Tk is the preferred standardized
      bacterial/archaeal route. CAT/BAT and sourmash tax genome are curated methodological fallbacks when their own reference
      requirements are satisfied. A non-bacterial/non-archaeal input is a workflow-scope mismatch and should not be solved
      by simply switching tools.
    candidates:
