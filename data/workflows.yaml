    - cutadapt
  - operation: functional_profiling
    name: Functional profiling
    description: 'Characterize the metabolic and functional potential of the microbial community. Candidate methods use
      different strategies: HUMAnN performs quantitative read-based functional profiling, whereas eggNOG-mapper performs
      orthology-based functional annotation of genes or assembled sequence. Their outputs are therefore complementary
      rather than strictly equivalent.

      '
    candidates:
