    name: Read preprocessing
    description: 'Perform adapter removal and quality filtering when indicated by raw-read quality assessment.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: metagenome_assembly
    name: Metagenome assembly
    description: 'Assemble short metagenomic reads into contigs. Multiple assemblers can be compared because performance
      may depend on dataset complexity.

      '
    candidates:
    - megahit
    - metaspades
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Assess assembly statistics before abundance estimation and genome binning.

      '
    candidates:
    - quast
