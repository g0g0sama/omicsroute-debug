      '
    candidates:
    - fastp
    - cutadapt
  - operation: pathway_analysis
    name: Metabolic pathway profiling
    description: 'Estimate microbial pathway presence and abundance from the metagenomic community. HUMAnN provides gene-family,
      reaction and pathway-level outputs using taxonomically informed reference searches and pathway reconstruction.

      '
    candidates:
    - humann
metagenome_illumina_virulence:
  name: Metagenome — Illumina virulence profiling
  context:
    sample_type: Metagenome
    sequencing: Illumina
    read_type: Paired-end
    goal: Virulence profiling
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Assess shotgun metagenomic read quality before pathogenicity profiling.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Remove adapters and low-quality sequences when indicated by quality-control results.

      '
