amplicon_illumina_alpha_nonphylogenetic:
  name: Downstream · non-phylogenetic alpha diversity
  description: Start from an existing amplicon feature table produced by any upstream BioFlow route (ASV, OTU, MOTU or
    another validated feature table). Calculate non-phylogenetic within-sample diversity such as observed features, Shannon
    or Simpson. A phylogenetic tree is not required. For default denoised ASV datasets, avoid singleton-dependent Chao1/ACE
    richness estimators.
  context:
    sample_type: Amplicon
    sequencing: Illumina
    read_type: Paired-end
    goal: Alpha diversity
    downstream_stage: feature_table
    metric_family: non_phylogenetic
  external_inputs:
  - amplicon_feature_table
  steps:
  - operation: alpha_diversity
    name: Non-phylogenetic alpha diversity
    description: Calculate within-sample diversity directly from the feature table. Use observed features/Shannon/Simpson
      or other justified non-phylogenetic metrics; do not build a phylogenetic tree merely because the analysis goal
      is alpha diversity.
    candidates:
    - qiime2_diversity
    - phyloseq
    - vegan
amplicon_illumina_alpha_phylogenetic:
  name: Downstream · phylogenetic alpha diversity (Faith PD)
  description: Calculate phylogenetic alpha diversity from an existing feature table plus a rooted phylogenetic tree
    whose tip identifiers correspond to the feature table. This route is appropriate for phylogenetically meaningful
    aligned markers; it should not be applied automatically to highly variable regions such as fungal ITS.
  context:
    sample_type: Amplicon
    sequencing: Illumina
    read_type: Paired-end
    goal: Alpha diversity
    downstream_stage: feature_table
    metric_family: phylogenetic
  external_inputs:
  - amplicon_feature_table
  - phylogenetic_tree_amplicon
  steps:
  - operation: alpha_diversity
    name: Phylogenetic alpha diversity
    description: Calculate Faith's phylogenetic diversity from the feature table and a compatible rooted tree.
    candidates:
    - qiime2_diversity
amplicon_illumina_beta_nonphylogenetic:
  name: Downstream · non-phylogenetic beta diversity
  description: Start from an existing amplicon feature table and sample metadata. Compute ecological dissimilarities
    such as Bray-Curtis/Jaccard or a compositional distance such as Aitchison, then ordinate samples. A phylogenetic
    tree is not required. If testing group separation with PERMANOVA, inspect multivariate dispersion as well as location
    effects.
  context:
    sample_type: Amplicon
    sequencing: Illumina
    read_type: Paired-end
    goal: Beta diversity
    downstream_stage: feature_table
    metric_family: non_phylogenetic
  external_inputs:
  - amplicon_feature_table
  - sample_metadata
  steps:
  - operation: beta_diversity
    name: Non-phylogenetic beta diversity and ordination
    description: Compute a justified non-phylogenetic distance/dissimilarity and ordination. Bray-Curtis/Jaccard and
      Aitchison answer different questions, so the metric should match the biological interpretation rather than being
      selected by habit.
    candidates:
    - qiime2_diversity
    - vegan
    - phyloseq
amplicon_illumina_beta_phylogenetic:
  name: Downstream · phylogenetic beta diversity (UniFrac)
  description: Calculate phylogenetic beta diversity such as weighted or unweighted UniFrac from an existing feature
    table plus a rooted tree. This route is useful for markers with defensible sequence alignment/phylogeny and should
    not be the automatic default for ITS.
  context:
    sample_type: Amplicon
    sequencing: Illumina
    read_type: Paired-end
    goal: Beta diversity
    downstream_stage: feature_table
    metric_family: phylogenetic
  external_inputs:
  - amplicon_feature_table
  - sample_metadata
  - phylogenetic_tree_amplicon
  steps:
  - operation: beta_diversity
    name: Phylogenetic beta diversity and ordination
    description: Compute weighted/unweighted UniFrac and ordination using a feature table whose feature IDs match the
      tips in the rooted phylogenetic tree.
    candidates:
    - qiime2_diversity
    - phyloseq
amplicon_illumina_da_simple:
  name: Downstream · simple independent-group DA
  description: Differential abundance from an existing amplicon count table for a simple independent-group comparison.
    ANCOM-BC2 and ALDEx2 are treated as strong microbiome-oriented choices; DESeq2 remains available as a conditional
    count-model sensitivity/legacy option.
  context:
    sample_type: Amplicon
    sequencing: Illumina
    read_type: Paired-end
    goal: Differential abundance
    downstream_stage: feature_table
    analysis_design_type: simple_independent
  external_inputs:
  - amplicon_feature_table
  - sample_metadata
  - analysis_design
  steps:
  - operation: differential_abundance
    name: Differential abundance analysis
    description: Analyze the existing microbial feature-count table without rerunning primer trimming, denoising or OTU
      clustering. Preserve the original integer count structure unless the selected method explicitly specifies a transformation
      internally.
    candidates:
    - ancombc2
    - aldex2
    - deseq2
amplicon_illumina_da_multivariable:
  name: Downstream · multigroup / covariate-adjusted DA
  description: Differential abundance for more than two groups, continuous predictors or models requiring covariate adjustment.
    ANCOM-BC2 is prioritized because it directly supports multi-group global, pairwise, Dunnett-type and trend analyses
    with covariate adjustment.
  context:
    sample_type: Amplicon
    sequencing: Illumina
    read_type: Paired-end
    goal: Differential abundance
    downstream_stage: feature_table
    analysis_design_type: multivariable
  external_inputs:
  - amplicon_feature_table
  - sample_metadata
  - analysis_design
  steps:
  - operation: differential_abundance
    name: Differential abundance analysis
    description: Analyze the existing microbial feature-count table without rerunning primer trimming, denoising or OTU
      clustering. Preserve the original integer count structure unless the selected method explicitly specifies a transformation
      internally.
    candidates:
    - ancombc2
