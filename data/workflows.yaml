bacterial_illumina_wgs:
  name: Bacterial isolate — Illumina WGS
  context:
    sample_type: Bacterial isolate
    sequencing: Illumina
    read_type: Paired-end
    goal: Whole genome characterization
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Inspect raw Illumina sequencing quality, base quality distributions and possible sequencing artefacts
      before downstream analysis.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Adapter removal and quality filtering can be performed when indicated by raw-read QC.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: genome_assembly
    name: Genome assembly
    description: 'Reconstruct the bacterial genome from Illumina paired-end reads.

      '
    candidates:
    - spades
    - shovill
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Evaluate assembly statistics and structural quality before downstream analysis.

      '
    candidates:
    - quast
  - operation: genome_annotation
    name: Genome annotation
    description: 'Identify genes and other genomic features in the assembled bacterial genome.

      '
    candidates:
    - bakta
    - prokka
bacterial_nanopore_wgs:
  name: Bacterial isolate — Oxford Nanopore WGS
  context:
    sample_type: Bacterial isolate
    sequencing: Oxford Nanopore
    read_type: Long reads
    goal: Whole genome characterization
  steps:
  - operation: raw_read_qc
    name: Long-read quality control
    description: 'Inspect read-length distributions, sequencing quality and overall characteristics of Oxford Nanopore
      reads.

      '
    candidates:
    - nanoplot
  - operation: read_preprocessing
    name: Long-read preprocessing
    description: 'Filter or trim low-quality and very short long reads when indicated by QC results.

      '
    candidates:
    - chopper
    - filtlong
  - operation: genome_assembly
    name: Long-read genome assembly
    description: 'Reconstruct the bacterial genome using Oxford Nanopore long reads.

      '
    candidates:
    - flye
    - raven
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Evaluate the resulting genome assembly before downstream interpretation.

      '
    candidates:
    - quast
  - operation: genome_annotation
    name: Genome annotation
    description: 'Identify genes and other genomic features in the assembled bacterial genome.

      '
    candidates:
    - bakta
    - prokka
metagenome_illumina_strain_phylogenomics:
  name: Metagenome — Illumina strain-level phylogenomics
  context:
    sample_type: Metagenome
    sequencing: Illumina
    read_type: Paired-end
    goal: Strain-level phylogenomics
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: Run read-quality assessment across the metagenomic sample collection.
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: Preprocess the metagenomic read collection consistently across samples.
    candidates:
    - fastp
    - cutadapt
  - operation: taxonomic_profiling
    name: Species profiling and marker mapping
    description: Run MetaPhlAn for each sample and retain its marker-mapping output for StrainPhlAn.
    candidates:
    - metaphlan
  - operation: marker_reconstruction
    name: Consensus marker reconstruction
    candidates:
    - sample2markers
    description: Convert each MetaPhlAn marker-mapping output into sample-specific consensus markers.
  - operation: strain_profiling
    name: Strain-level phylogenomics
    description: Infer strain-level phylogenomics for a selected species/clade from the consensus-marker collection.
      At least four sample/reference inputs must enter and at least four must survive filtering.
    candidates:
    - strainphlan
  external_inputs:
  - raw_paired_fastq_collection
  description: StrainPhlAn multi-sample strain-level phylogenomics. Process each metagenomic sample with MetaPhlAn, reconstruct
    sample-specific consensus markers with sample2markers, then infer a species-specific strain phylogeny with StrainPhlAn.
    Current StrainPhlAn requires at least four total sample/reference inputs and at least four to remain after filtering.
metagenome_illumina_microdiversity:
  name: Metagenome — Illumina microdiversity profiling
  context:
    sample_type: Metagenome
    sequencing: Illumina
    read_type: Paired-end
    goal: Microdiversity profiling
  external_inputs:
  - representative_genome_database_fasta
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Assess shotgun metagenomic read quality before reference-based population genomic analysis.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Remove adapters and low-quality sequence before read mapping.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: read_mapping
    name: Competitive mapping to representative genomes
    description: Map reads simultaneously against the representative-genome database so competing homologous genomes
      are present in the same alignment search.
    candidates:
    - bowtie2
  - operation: alignment_processing
    name: Alignment sorting and indexing
    description: 'Convert and process the read alignment into a coordinate-sorted BAM file and create its index before
      downstream population-genomic analysis.

      '
    candidates:
    - samtools
  - operation: strain_profiling
    name: Population microdiversity analysis
    description: Profile nucleotide diversity, SNVs, linkage and other population-genomic metrics with inStrain using
      the same representative-genome database that was used for competitive mapping.
    candidates:
    - instrain
  description: Population microdiversity profiling with inStrain using competitive mapping against a dereplicated representative-genome
    database. Mapping to many relevant genomes simultaneously is the recommended default because mapping one genome at
    a time increases read mis-assignment and false-positive SNP risk.
bacterial_illumina_amr:
  name: Bacterial isolate — Illumina antimicrobial resistance analysis
  context:
    sample_type: Bacterial isolate
    sequencing: Illumina
    read_type: Paired-end
    goal: Antimicrobial resistance detection
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Evaluate Illumina read quality before downstream resistance analysis.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Remove adapters and low-quality sequence when indicated by quality-control results.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: genome_assembly
    name: Genome assembly
    description: 'Reconstruct the bacterial isolate genome for assembly-based AMR detection.

      '
    candidates:
    - spades
    - shovill
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Evaluate assembly quality before interpreting antimicrobial resistance results.

      '
    candidates:
    - quast
  - operation: amr_detection
    name: Antimicrobial resistance detection
    description: 'Detect known antimicrobial resistance genes and, where supported by the selected method, resistance-associated
      point mutations. Database version and organism-specific coverage should be considered during interpretation.

      '
    candidates:
    - amrfinderplus
    - resfinder
    - abricate
bacterial_illumina_virulence:
  name: Bacterial isolate — Illumina virulence profiling
  context:
    sample_type: Bacterial isolate
    sequencing: Illumina
    read_type: Paired-end
    goal: Virulence profiling
  steps:
  - operation: raw_read_qc
    name: Raw read quality control
    description: 'Evaluate Illumina sequencing quality before downstream virulence analysis.

      '
    candidates:
    - fastqc
  - operation: read_preprocessing
    name: Read preprocessing
    description: 'Perform adapter removal and quality filtering when indicated by read-quality assessment.

      '
    candidates:
    - fastp
    - cutadapt
  - operation: genome_assembly
    name: Genome assembly
    description: 'Reconstruct the bacterial genome for assembly-based virulence gene screening.

      '
    candidates:
    - spades
    - shovill
  - operation: assembly_qc
    name: Assembly quality control
    description: 'Assess assembly quality before virulence gene detection and biological interpretation.

      '
    candidates:
    - quast
  - operation: virulence_profiling
    name: Virulence profiling
    description: 'Screen the isolate genome for known virulence factors. Database and species coverage differ substantially
