    name: Consensus bin refinement
    description: 'Integrate multiple independent binning results and select a refined consensus MAG collection.

      '
    candidates:
    - dastool
  - operation: mag_quality
    name: MAG quality assessment
    description: 'Estimate genome completeness and contamination for the refined MAG collection.

      '
    candidates:
    - checkm2
