    name: Map the sample back to its assembly
    candidates:
    - bowtie2
    description: Map the same sample's preprocessed reads back to the sample assembly for abundance/depth-aware binning.
  - operation: alignment_processing
    name: Alignment sorting and indexing
    description: 'Convert the alignment into a coordinate-sorted BAM file and generate its BAM index.

      '
    candidates:
    - samtools
  - operation: coverage_estimation
    name: Contig coverage estimation
    description: Summarize contig depth from the coordinate-sorted BAM for abundance-aware binners.
    candidates:
    - jgi_depth
  - operation: genome_binning
    name: Independent MAG binning
    description: 'Run multiple independent genome-binning algorithms. At least two successful binning methods are required
      before consensus refinement with DAS Tool.

      '
    mode: parallel
    min_successful_candidates: 2
    aggregate_produces:
    - multiple_mag_bin_sets
    candidates:
    - semibin2
    - metabat2
    - maxbin2
    - concoct
