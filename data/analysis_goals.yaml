bacterial_isolate:

  sample_type: Bacterial isolate

  label: Bacterial isolate

  description: >
    Genome-scale characterization of cultured
    bacterial isolates using short-read,
    long-read or hybrid sequencing data.

  goals:

    - id: whole_genome_characterization
      label: Whole genome characterization
      priority: core

    - id: genome_assembly
      label: Genome assembly
      priority: core

    - id: variant_analysis
      label: Variant analysis
      priority: core

    - id: species_identification
      label: Species identification
      priority: core

    - id: mlst
      label: MLST / strain typing
      priority: core

    - id: amr_detection
      label: Antimicrobial resistance detection
      priority: core

    - id: virulence_profiling
      label: Virulence profiling
      priority: core

    - id: plasmid_detection
      label: Plasmid detection
      priority: core

    - id: prophage_detection
      label: Prophage detection
      priority: extended

    - id: pangenome_analysis
      label: Pangenome analysis
      priority: extended

    - id: phylogenomics
      label: Phylogenomics
      priority: extended


eukaryotic_genome:

